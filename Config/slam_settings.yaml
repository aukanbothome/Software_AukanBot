# Ajustes para el SLAM con Kinect y Open3D

tsdf_volume:
  voxel_length: 0.02        # tamaño de voxel en metros (2 cm)
  sdf_trunc: 0.04           # truncamiento TSDF (4 cm)
  color_type: "RGB8"

depth:
  depth_scale: 1000.0       # 1000 mm = 1 m
  depth_trunc_m: 3.5        # ignorar puntos más lejos que esto
  min_valid_distance_m: 0.3

odometry:
  use_hybrid_term: true
  max_iteration: 20
  min_step_confidence: 0.1

visualization:
  update_interval_s: 1.0
  show_rgb_window: true
